name: offway
description: "A new Flutter project."
publish_to: 'none'
version: 1.1.2+44

environment:
  sdk: ^3.10.3

dependencies:
  dio: ^5.10.0
  flutter:
    sdk: flutter
  flutter_naver_map: ^1.4.4
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.3.0
  gal: ^2.3.2
  go_router: ^17.3.0
  kakao_flutter_sdk_user: ^2.0.1
  # 카카오톡으로 코스 링크 보내기 (share)
  kakao_flutter_sdk_share: ^2.0.1
  # 공유 링크로 앱이 열릴 때 토큰을 받는다
  app_links: ^6.3.2
  sign_in_with_apple: ^7.0.1
  url_launcher: ^6.3.1
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  google_sign_in: ^7.2.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.2
  # 서버는 data-only 메시지를 보낸다(core #270) — 문구를 앱이 소유하려는
  # 것이라, 배너도 앱이 직접 그려야 한다
  flutter_local_notifications: ^22.3.0
  app_badge_plus: ^1.3.4
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_secure_storage_platform_interface: ^2.0.2
  # 외부 링크를 앱 안(SFSafariViewController)에서 여는지 테스트가 확인한다 —
  # 채널 인자 규약 대신 PreferredLaunchMode를 직접 본다
  url_launcher_platform_interface: ^2.3.2
  flutter_launcher_icons: ^0.14.4

# 앱 아이콘 생성 설정. 원본(assets/icon/app_icon.png) 교체 후
# `dart run flutter_launcher_icons` 실행하면 iOS 아이콘 세트가 재생성된다.
flutter_launcher_icons:
  ios: true
  image_path: "assets/icon/app_icon.png"
  # iOS는 알파 채널이 있으면 App Store 업로드가 거부된다
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/mock/
    - assets/data/

  # 디자인 시스템 본문 서체 (SIL OFL 1.1 · assets/fonts/LICENSE.txt)
  # 타이포 토큰이 쓰는 400·500·600·700만 포함한다
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
